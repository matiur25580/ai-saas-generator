name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MONGODB_TEST_URI: mongodb://localhost:27017/ai_saas_test?replicaSet=rs0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Start MongoDB replica set
        run: |
          set -euo pipefail
          docker run --detach --name mongo-ci --publish 27017:27017 mongo:7 mongod --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec mongo-ci mongosh --quiet --eval "db.adminCommand({ ping: 1 }).ok" 2>/dev/null | grep -q 1; then
              break
            fi
            sleep 2
          done
          docker exec mongo-ci mongosh --quiet --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]})"
          for attempt in $(seq 1 30); do
            if docker exec mongo-ci mongosh --quiet --eval "db.hello().isWritablePrimary" 2>/dev/null | grep -q true; then
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB replica set did not become primary" >&2
          exit 1
      - run: node --check server.js
        working-directory: backend
      - name: Check staging smoke-test script syntax
        run: node --check ../scripts/staging-auth-smoke.mjs
        working-directory: backend
      - run: node --check utils/credits.js && node --check utils/auth.js && node --check utils/session.js && node --check utils/MongoRateLimitStore.js && node --check models/RateLimit.js && node --check routes/auth.js
        working-directory: backend
      - name: Report backend dependency advisories
        working-directory: backend
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); for (const [name, item] of Object.entries(a.vulnerabilities || {})) console.log(JSON.stringify({name, severity:item.severity, range:item.range, fixAvailable:item.fixAvailable}))"
      - run: npm test
        working-directory: backend
      - name: Stop MongoDB
        if: always()
        run: docker rm --force mongo-ci || true
